name: Deploy form to Azure Static Web Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: azure-static-web-apps-production
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    name: Build and deploy form

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install generator dependency
        run: python -m pip install openpyxl

      - name: Generate the form
        run: |
          mkdir -p _site
          python form/generate_form.py MASTER.xlsx _site/index.html --expires-on ""

      - name: Ask search engines not to index the form
        run: |
          echo "User-agent: *" > _site/robots.txt
          echo "Disallow: /" >> _site/robots.txt

      - name: Include Azure access configuration if present
        run: |
          if [ -f staticwebapp.config.json ]; then
            cp staticwebapp.config.json _site/staticwebapp.config.json
          fi

      - name: Verify generated HTML exists
        run: test -s _site/index.html

      - name: Install authentication dependency
        run: npm install --no-save @actions/core@1.6.0 @actions/http-client

      - name: Get GitHub identity token
        uses: actions/github-script@v6
        id: idtoken
        with:
          script: |
            const core = require('@actions/core');
            return await core.getIDToken();
          result-encoding: string

      - name: Deploy to Azure
        uses: Azure/static-web-apps-deploy@v1
        with:
          # Replace this line with the SAME token line from your existing workflow.
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BLUE_SAND_0E5E7AC10 }}
          github_id_token: ${{ steps.idtoken.outputs.result }}
          action: "upload"
          app_location: "_site"
          api_location: ""
          output_location: ""
          skip_app_build: true
